<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b0b4a">
<title>عجلة الصحاب</title>
<style>
:root{--gold:#ffc83d;--fs:min(27vw,112px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff}
body{background:radial-gradient(120% 80% at 50% 0%,#5b1fd1 0%,#2a0f7a 45%,#0c0638 100%)}
body:before{content:"";position:fixed;inset:0;background:
 radial-gradient(circle at 15% 20%,#ff2d7a55 0,transparent 25%),
 radial-gradient(circle at 85% 30%,#25d5ff55 0,transparent 25%),
 radial-gradient(circle at 50% 95%,#ffc83d33 0,transparent 30%);pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);gap:6px}
.title{margin:0;text-align:center;line-height:1}
.title .ar{display:block;font-size:clamp(34px,11vw,54px);font-weight:900;background:linear-gradient(90deg,#ffb300,#ff5ea8 45%,#35e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1b0b4a) drop-shadow(0 0 12px #c04bff)}
.title .en{display:inline-block;margin-top:2px;font-size:clamp(16px,5vw,22px);font-weight:900;letter-spacing:2px;color:#e9fbff;text-shadow:0 2px 0 #6b2bd8,0 0 10px #35e0ff}
#status{font-weight:800;font-size:15px;padding:5px 14px;border-radius:99px;background:#0006;border:1px solid #fff3}
.wheelwrap{position:relative;width:min(88vw,360px);aspect-ratio:1;flex:none;margin-top:6px}
#wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #ffc83d,0 0 0 10px #7a2cff,0 0 40px 8px #35e0ffaa,0 0 80px 14px #ff2d7a66}
.pointer{position:absolute;left:50%;top:-16px;width:0;height:0;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 3px 2px #000a);z-index:3}
.pointer:after{content:"";position:absolute;left:-6px;top:-34px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
#faces{display:flex;justify-content:center;gap:10px;margin-top:14px;direction:ltr;width:100%}
.face{position:relative;width:var(--fs);display:flex;flex-direction:column;align-items:center;transition:opacity .4s,transform .4s}
.av{position:relative;width:var(--fs);height:var(--fs)}
.av img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000a);transition:filter .4s}
.hat,.gl{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;line-height:1;z-index:2}
.hat{top:-12%;font-size:calc(var(--fs)*.5);filter:drop-shadow(0 2px 2px #0008)}
.gl{top:30%;font-size:calc(var(--fs)*.62)}
.fxl{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
.tear,.float{position:absolute;pointer-events:none;will-change:transform,opacity}
.tear{font-size:calc(var(--fs)*.22);animation:fall 1.1s ease-in forwards}
.float{font-size:calc(var(--fs)*.26);animation:rise 1.8s ease-out forwards}
@keyframes fall{0%{transform:translateY(0) scale(.7);opacity:1}100%{transform:translateY(calc(var(--fs)*.9)) scale(1.1);opacity:0}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(calc(var(--fs)*-.9)) rotate(25deg);opacity:0}}
.nm{margin-top:6px;font-weight:900;font-size:15px;text-align:center;text-shadow:0 2px 0 #000a;line-height:1.1}
.nm small{display:block;font-size:12px;opacity:.85;font-weight:700}
.badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#3b1d00;font-weight:900;font-size:12px;border-radius:99px;padding:2px 7px;z-index:4;box-shadow:0 2px 6px #0008;display:none;direction:rtl}
.face.hasbadge .badge{display:block}
.face.win .av{animation:bounce .5s ease-in-out infinite alternate}
.face.finalwin .av{animation:mock .35s ease-in-out infinite alternate}
.face.finalwin .av img{filter:drop-shadow(0 0 14px #ffc83d) drop-shadow(0 4px 8px #000a)}
.face.lose .av img{filter:grayscale(.85) brightness(.85) drop-shadow(0 4px 8px #000a);animation:sag 1.2s ease-in-out infinite alternate}
.face.finallose .av img{filter:grayscale(1) contrast(.9) brightness(.75) drop-shadow(0 4px 8px #000a);animation:sob .12s linear infinite alternate}
.face.finallose .av{transform:scale(.92)}
.face.parked{opacity:.6;transform:scale(.88)}
@keyframes bounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.14)}}
@keyframes mock{from{transform:scale(1.22) rotate(-7deg)}to{transform:scale(1.42) rotate(7deg) translateY(-8px)}}
@keyframes sag{from{transform:rotate(-5deg) scale(1,.97)}to{transform:rotate(5deg) scale(.96,.9)}}
@keyframes sob{from{transform:translateX(-3px) rotate(-7deg) scale(.9,.8)}to{transform:translateX(3px) rotate(7deg) scale(.86,.78)}}
#msg{min-height:58px;text-align:center;font-weight:900;font-size:clamp(16px,5vw,21px);line-height:1.35;padding:6px 10px;text-shadow:0 2px 0 #000a;margin-top:6px}
#msg small{display:block;font-size:13px;font-weight:700;opacity:.9}
#btn{margin-top:auto;width:min(92vw,380px);border:0;border-radius:18px;padding:15px;font-weight:900;font-size:22px;font-family:inherit;color:#3b1d00;background:linear-gradient(180deg,#ffe27a,#ffb300);box-shadow:0 6px 0 #b36b00,0 10px 24px #0007;cursor:pointer}
#btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b36b00}
#btn:disabled{opacity:.55;filter:grayscale(.4)}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf{position:absolute;top:-40px;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-height:700px){.wheelwrap{width:min(78vw,300px)}.title .ar{font-size:34px}}
</style>
</head>
<body>
<div id="app">
  <h1 class="title"><span class="ar">عجلة الصحاب</span><span class="en">LUCKY WHEEL</span></h1>
  <div id="status"></div>
  <div class="wheelwrap"><canvas id="wheel"></canvas><div class="pointer"></div></div>
  <div id="faces"></div>
  <div id="msg"></div>
  <button id="btn">لف العجلة 🎡</button>
</div>
<div id="confetti"></div>

const P = {
  mazen:  {name:'Mazen',  ar:'مازن',  color:'#2f80ff'},
  kerols: {name:'Kerols', ar:'كيرلس', color:'#ff2d55'},
  eslam:  {name:'Eslam',  ar:'إسلام', color:'#22c55e'}
};
const ORDER = ['mazen','kerols','eslam'];
const $ = s => document.querySelector(s);
const imgs = {};
ORDER.forEach(id => { const i = new Image(); i.onload = draw; i.src = IMG[id]; imgs[id] = i; });

let state;
function reset(){
  state = {round:1, active:ORDER.slice(), rot:0, spinning:false, ctrl:{}, over:false};
  renderFaces({});
  $('#status').textContent = 'الجولة الأولى • 3 لاعبين';
  $('#msg').innerHTML = 'مين هياخد الذراع الأول؟ 🎮<small>إدوس لف العجلة</small>';
  $('#btn').textContent = 'لف العجلة 🎡';
  $('#btn').disabled = false;
  $('#btn').onclick = spin;
  draw();
}

/* ---------- wheel ---------- */
const cv = $('#wheel'), ctx = cv.getContext('2d');
let SZ = 0;
function fit(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio||1, 3);
  SZ = r.width;
  cv.width = cv.height = Math.round(SZ*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', fit);

function draw(){
  if(!SZ || !state) return;
  const c = SZ/2, R = c-2, n = state.active.length, seg = Math.PI*2/n;
  ctx.clearRect(0,0,SZ,SZ);
  ctx.save(); ctx.translate(c,c); ctx.rotate(state.rot);
  state.active.forEach((id,i) => {
    const a0 = i*seg, a1 = a0+seg, am = a0+seg/2, p = P[id];
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    const g = ctx.createRadialGradient(0,0,R*.1,0,0,R);
    g.addColorStop(0,'#fff'); g.addColorStop(.18,p.color); g.addColorStop(1,p.color);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    // face (upright, cutout) + name (upright)
    const dist = R*(n===2?.52:.55), px = Math.cos(am)*dist, py = Math.sin(am)*dist, im = imgs[id];
    const fh = R*(n===2?.62:.56);
    ctx.save(); ctx.translate(px,py); ctx.rotate(-state.rot);
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    if(im.complete && im.naturalWidth) ctx.drawImage(im,-fh/2,-fh/2,fh,fh);
    ctx.shadowColor = 'transparent';
    ctx.font = '900 '+Math.round(R*.095)+'px system-ui,Arial'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000b'; ctx.fillStyle = '#fff'; ctx.lineJoin = 'round';
    ctx.strokeText(p.name,0,fh/2+R*.09); ctx.fillText(p.name,0,fh/2+R*.09);
    ctx.restore();
  });
  ctx.restore();
  // hub
  ctx.beginPath(); ctx.arc(c,c,R*.1,0,Math.PI*2);
  ctx.fillStyle = '#ffc83d'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.font = Math.round(R*.12)+'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🎮',c,c+1); ctx.textBaseline = 'alphabetic';
}

function randInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
const TAU = Math.PI*2, mod = (x,m)=>((x%m)+m)%m, ease = t=>1-Math.pow(1-t,3.2);

function spin(){
  if(state.spinning || state.over) return;
  state.spinning = true; $('#btn').disabled = true;
  ac();
  const n = state.active.length, seg = TAU/n, win = randInt(n);
  const jitter = (Math.random()-.5)*seg*.6;
  const target = mod(-Math.PI/2 - ((win+.5)*seg + jitter), TAU);
  const start = state.rot;
  const end = start + (5+randInt(3))*TAU + mod(target-start, TAU);
  const dur = 5200, t0 = performance.now();
  let lastIdx = -1;
  $('#msg').innerHTML = 'العجلة بتلف... 🌀<small>كله يدعي 😂</small>';
  (function frame(now){
    const t = Math.min(1,(now-t0)/dur);
    state.rot = start + (end-start)*ease(t);
    const idx = Math.floor(mod(-Math.PI/2 - state.rot, TAU)/seg);
    if(idx !== lastIdx){ if(lastIdx !== -1) tick(); lastIdx = idx; }
    draw();
    if(t < 1) requestAnimationFrame(frame); else done(win);
  })(t0);
}

/* ---------- game flow ---------- */
function done(winIdx){
  state.spinning = false;
  const id = state.active[winIdx];
  if(state.round === 1){
    state.ctrl[id] = 1;
    const st = {}; state.active.forEach(x => st[x] = x===id ? 'win' : 'lose');
    renderFaces(st);
    $('#msg').innerHTML = `${P[id].ar} خد الذراع الأول 🎮😎<small>والاتنين التانيين لسه في الخطر 😭</small>`;
    winSound(false); cryBurst(false); confetti(26);
    state.first = id;
    state.active = state.active.filter(x => x !== id);
    $('#btn').textContent = 'الجولة الحاسمة ⚔️'; $('#btn').disabled = false;
    $('#btn').onclick = nextRound;
    state.round = 2; state.pending = true;
  } else {
    const loser = state.active[1-winIdx];
    state.ctrl[id] = 2;
    const st = {}; st[state.first] = 'parked'; st[id] = 'finalwin'; st[loser] = 'finallose';
    renderFaces(st);
    $('#msg').innerHTML = `${P[id].ar} خد الذراع التاني 🎮🏆 ونجا من الدكة! 😂<small>${P[loser].ar}: هتفضل قاعد مستنيهم! 😭🛋️</small>`;
    winSound(true); cryBurst(true); confetti(70);
    if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
    state.over = true;
    $('#btn').textContent = 'العب تاني 🔄'; $('#btn').disabled = false;
    $('#btn').onclick = reset;
  }
}
function nextRound(){
  state.pending = false; state.rot = 0;
  const st = {}; st[state.first] = 'parked';
  renderFaces(st);
  $('#status').textContent = 'الجولة التانية والحاسمة • 2 بس 🔥';
  $('#msg').innerHTML = 'مين هيفلت من الدكة؟ 🛋️<small>الخسران هيتفرج عليهم</small>';
  $('#btn').textContent = 'لف العجلة 🎡';
  $('#btn').onclick = spin;
  draw();
}

/* ---------- faces + effects ---------- */
let fxTimer;
function renderFaces(st){
  clearInterval(fxTimer);
  const el = $('#faces'); el.innerHTML = '';
  ORDER.forEach(id => {
    const s = st[id] || 'idle', d = document.createElement('div');
    d.className = 'face '+s+(state.ctrl[id] ? ' hasbadge' : ''); d.dataset.id = id;
    d.innerHTML = `<div class="av"><img alt="${P[id].name}" src="${IMG[id]}"><span class="hat">${((s==='win'||s==='finalwin')&&id!=='kerols')?'👑':''}</span><span class="gl">${(s==='finalwin'&&id!=='mazen')?'🕶️':''}</span><span class="fxl"></span></div><div class="nm">${P[id].name}<small>${P[id].ar}</small></div><div class="badge">🎮 ${state.ctrl[id]||''}</div>`;
    el.appendChild(d);
  });
  fxTimer = setInterval(() => {
    document.querySelectorAll('.face.lose,.face.finallose').forEach(f => {
      const big = f.classList.contains('finallose'), box = f.querySelector('.fxl');
      for(let k=0;k<(big?3:1);k++){
        const t = document.createElement('span');
        t.className = 'tear'; t.textContent = big && Math.random()<.35 ? '😭' : '💧';
        t.style.left = (k%2 ? 58+Math.random()*10 : 24+Math.random()*10)+'%'; t.style.top = '42%';
        box.appendChild(t); setTimeout(()=>t.remove(),1200);
      }
      if(Math.random()<(big?.7:.4)){
        const h = document.createElement('span');
        h.className = 'float'; h.textContent = ['💔','🧻','😢'][randInt(3)];
        h.style.left = (Math.random()*80)+'%'; h.style.top = '-5%';
        box.appendChild(h); setTimeout(()=>h.remove(),1900);
      }
    });
    document.querySelectorAll('.face.finalwin .fxl').forEach(box => {
      const h = document.createElement('span'); h.className = 'float';
      h.textContent = ['😂','🏆','🎉'][randInt(3)]; h.style.left = (Math.random()*80)+'%'; h.style.top = '-5%';
      box.appendChild(h); setTimeout(()=>h.remove(),1900);
    });
  }, 260);
}
function confetti(n){
  const box = $('#confetti');
  for(let i=0;i<n;i++){
    const c = document.createElement('span'); c.className = 'conf';
    c.textContent = ['🎉','🏆','😂','👑','🎮','✨','🎊'][randInt(7)];
    c.style.left = Math.random()*100+'vw'; c.style.fontSize = (18+Math.random()*22)+'px';
    c.style.animationDuration = (2.2+Math.random()*2.2)+'s'; c.style.animationDelay = Math.random()*.8+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),5500);
  }
}

/* ---------- sound (WebAudio, no files needed) ---------- */
let AC;
function ac(){
  if(!AC){ const C = window.AudioContext||window.webkitAudioContext; if(C) AC = new C(); }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f,t0,d,type,vol,f2){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+d+.05);
}
function tick(){ if(AC) tone(1100,AC.currentTime,.04,'square',.05); }
function laugh(big){
  if(!AC) return;
  const n = big?9:5, t = AC.currentTime+.15;
  for(let i=0;i<n;i++){
    const t0 = t+i*.17, base = (big?330:290)+(i%2?55:0)-i*(big?6:3);
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(base,t0); o.frequency.linearRampToValueAtTime(base*.8,t0+.14);
    lfo.frequency.value = 22; lg.gain.value = 14; lfo.connect(lg).connect(o.frequency);
    f.type = 'bandpass'; f.frequency.setValueAtTime(950,t0); f.frequency.linearRampToValueAtTime(650,t0+.14); f.Q.value = 2.5;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(big?.5:.35,t0+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+.15);
    o.connect(f).connect(g).connect(AC.destination); lfo.start(t0); o.start(t0); o.stop(t0+.18); lfo.stop(t0+.18);
  }
}
function winSound(big){
  if(!AC) return; const t = AC.currentTime;
  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.22,'triangle',.22));
  laugh(big);
}
function cryBurst(big){
  if(!AC) return; const t = AC.currentTime+(big?.4:.9), n = big?4:2;
  for(let i=0;i<n;i++){
    const t0 = t+i*.55, o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(big?640:560,t0); o.frequency.exponentialRampToValueAtTime(300,t0+.5);
    l.frequency.value = 9; lg.gain.value = 22; l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(big?.3:.2,t0+.05); g.gain.exponentialRampToValueAtTime(.0001,t0+.5);
    o.connect(g).connect(AC.destination); l.start(t0); o.start(t0); o.stop(t0+.55); l.stop(t0+.55);
  }
}
